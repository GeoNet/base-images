[tool.poetry]
name = "arcgis-base-image"
version = "2.0.0"
description = "Base image containing Python and arcgis"
authors = ["GeoNet"]

[tool.poetry.dependencies]
python = "3.12.13"
arcgis = "2.4.3"
numpy = "2.5.3"
pandas = "3.0.5"
geopandas = "1.1.4"
python-dotenv = "1.2.3"
boto3 = "1.43.89"
toml = "0.10.2"
datadog-api-client = "2.60.0"
pyshp = "3.1.6"
gdal = "3.10.3"
azure-storage-blob = "12.30.1"
arcgis-mapping = "5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"